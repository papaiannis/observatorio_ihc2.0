services:
  - type: web
    name: observatorio-backend
    env: node
    rootDir: backend
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: NOVITA_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
