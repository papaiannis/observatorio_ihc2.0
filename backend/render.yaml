services:
  - type: web
    name: observatorio-backend
    env: node
    region: ohio # Option (us-east, oregon, etc.)
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
